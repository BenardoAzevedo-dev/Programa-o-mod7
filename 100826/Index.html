<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FanArts</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="cabecalho">

        <!-- Foto de perfil -->
        <img 
            src="https://commons.wikimedia.org/wiki/Special:FilePath/Close-up_of_mole.jpg" 
            alt="Foto de perfil"
            class="foto-perfil"
        >

        <!-- Nome do usuário -->
        <div class="nome-usuario">
            Xuxu
        </div>

        <!-- Dois pequenos botões -->
        <div class="botao botao-1"></div>
        <div class="botao botao-2"></div>

    </header>

    <!-- Barra de título -->
    <div class="barra-pesquisa">
    <svg class="icone-pesquisa" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" stroke="#777" stroke-width="2"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="#777" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <input 
        type="text" 
        class="campo-pesquisa" 
        placeholder="Pesquisar..."
    >
</div>

    <!-- Conteúdo principal -->
    <main class="conteudo">

        <!-- Grade de fanarts -->
        <div class="grade-fanarts">
            <div class="fanart"></div>
            <div class="fanart"></div>
            <div class="fanart"></div>
            <div class="fanart"></div>
            <div class="fanart"></div>
            <div class="fanart"></div>
            <div class="fanart"></div>
            <div class="fanart"></div>
        </div>

        <!-- Coluna de reações -->
        <div class="reacoes">
            <div class="par-reacao">
                <div class="reacao reacao-roxa"></div>
                <div class="reacao reacao-azul"></div>
            </div>
            <div class="par-reacao">
                <div class="reacao reacao-roxa"></div>
                <div class="reacao reacao-azul"></div>
            </div>
            <div class="par-reacao">
                <div class="reacao reacao-roxa"></div>
                <div class="reacao reacao-azul"></div>
            </div>
        </div>

    </main>

</body>
</html>
