<!DOCTYPE html>
<html lang="pt-BR" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Organizador de Projetos</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>

    <script src='index.js'></script>
  </head>
  <body class="bg-light">
<div class="text-white text-center shadow mb-4"
     style="background-image: url('centro.jpg'); background-size: cover; background-position: center;">

  <div class="py-5" style="background: rgba(0, 0, 0, 0.5);">
    <div class="container">
      <h1 class="display-4 font-weight-bold mb-2" style="text-shadow: 0 2px 8px rgba(0,0,0,0.7);">
        <span class="mr-2">🏥</span>Pacientes do centro pokemon
      </h1>
      <p class="lead mb-0">Lista de pacientes internados no centro pokemon</p>
     
      <span class="badge badge-pill badge-light px-3 py-2 font-weight-bold text-dark">CRUD: JS + Bootstrap 4</span>
    </div>
  </div>

</div>
    <div class="container">
      <div class="row">
        
        <div class="col-md-4 mb-4">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white font-weight-bold">
              Novo Paciente
            </div>
            <div class="card-body" id='create-work'>
              <form id="work-form">
                
                <div class="form-group">
                  <label for="title" class="small font-weight-bold text-muted">Nome do paciente</label>
                  <input type="text" class="form-control" id="title" placeholder="Ex: Bulbassauro ..." required>
                </div>

                <div class="form-group">
                  <label for="class" class="small font-weight-bold text-muted">Tipagem</label>
                  <input type="text" class="form-control" id="class" placeholder="Ex: Lutador/Fada" required>
                </div>

                <div class="form-group">
                  <label for="coverImage" class="small font-weight-bold text-muted">Foto do paciente</label>
                  <input type="url" class="form-control" id="coverImage" placeholder="https://..." required>
                </div>

                <div class="form-group">
                  <label for="description" class="small font-weight-bold text-muted">Estado</label>
                  <textarea class="form-control" id="description" rows="3" placeholder="O que está sentindo..." required></textarea>
                </div>

                <button type="submit" class="btn btn-success btn-block shadow-sm">Adicionar a lista👩‍⚕️</button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <h3 class="h5 mb-3 text-secondary font-weight-bold">Pacientes Cadastrados</h3>
          
          <div class="row" id='work-container'>
            
            </div>
        </div>

      </div>
    </div>
    <footer class="bg-dark text-white-50 py-4 mt-5 border-top border-secondary">
      <div class="container text-center">
        <p class="mb-1 text-white font-weight-bold">📁 Repositório de Pacientes</p>
        <small class="d-block">
          Copyright &copy; 2026. Bernardo José de Mello Azevedo.
        </small>
        <div class="mt-2">
          <span class="badge badge-secondary p-2">IFSC Câmpus Chapecó</span>
        </div>
      </div>
    </footer>
    
  </body>
</html>
